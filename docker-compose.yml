name: atmos-gl
services:
  data_collector:
    image: ghcr.io/paulwaite87/atmos-gl:${IMAGE_TAG:-latest}
    # Matches the host's real user, same reasoning as atmos_gl_db's `user:` below --
    # ./data and ./config are host bind-mounts, not container-owned volumes, so this
    # container needs to write as whoever owns them on the host, not the image's
    # baked-in agluser (UID 1000, fixed at CI build time -- see Dockerfile).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: python -m atmos_gl.collectors.service --config /opt/project/config/atmos-gl.json
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - AIS_API_KEY=${AIS_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - CDSAPI_KEY=${CDSAPI_KEY}
      - EARTHDATA_TOKEN=${EARTHDATA_TOKEN}
      - TZ=Pacific/Auckland
      - PYTHONPATH=/opt/project/src
      - PYTHONUNBUFFERED=1
      # /tmp instead of agluser's own home dir -- writable by any UID regardless of
      # whether DOCKER_UID/GID happens to match the image's baked-in agluser, unlike
      # /home/agluser which is owned by (and only writable by) the image's fixed UID.
      - HOME=/tmp
      - POSTGRES_HOST=atmos_gl_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      atmos_gl_db:
        condition: service_healthy
      atmos_gl_db_migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/opt/project/data
      - ./config:/opt/project/config
    networks:
      - agl

  layer_builder:
    image: ghcr.io/paulwaite87/atmos-gl:${IMAGE_TAG:-latest}
    # See data_collector's user: comment above -- same host bind-mount ownership reasoning.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: python -m atmos_gl.layer_builder --config /opt/project/config/atmos-gl.json
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - TZ=Pacific/Auckland
      - PYTHONPATH=/opt/project/src
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - POSTGRES_HOST=atmos_gl_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      atmos_gl_db:
        condition: service_healthy
      atmos_gl_db_migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/opt/project/data
      - ./config:/opt/project/config
      - ./markers:/opt/project/markers
      # Bind-mounted rather than baked into the image so `make status` (scripts/
      # status.sh execs into this service) picks up scripts/ changes on a plain
      # `git pull` -- no image rebuild/republish needed, same reasoning as ./config
      # above. Read-only: nothing running in this container ever writes to it.
      - ./scripts:/opt/project/scripts:ro
    networks:
      - agl

  housekeeper:
    image: ghcr.io/paulwaite87/atmos-gl:${IMAGE_TAG:-latest}
    # See data_collector's user: comment above -- same host bind-mount ownership reasoning.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: python -m atmos_gl.housekeeper --config /opt/project/config/atmos-gl.json
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - TZ=Pacific/Auckland
      - PYTHONPATH=/opt/project/src
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
    restart: unless-stopped
    volumes:
      - ./data:/opt/project/data
      - ./config:/opt/project/config
    networks:
      - agl

  map_api:
    image: ghcr.io/paulwaite87/atmos-gl:${IMAGE_TAG:-latest}
    # See data_collector's user: comment above -- same host bind-mount ownership reasoning.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Reverted to a simpler runtime installation since agluser now owns the virtual environment
    # --proxy-headers/--forwarded-allow-ips: trust map_ui's nginx (the only path in,
    # see config/nginx.conf) to set X-Forwarded-Proto -- without this, request.url_for()
    # (used to build the Google OAuth redirect_uri, issue #303) would build it from the
    # raw internal http connection rather than the public-facing scheme. Scoped to Docker's
    # default bridge-network range (172.16.0.0/12), not '*' -- port 9000 is also published
    # straight to the host below, and '*' would let anyone hitting it directly spoof
    # X-Forwarded-Proto/Host and steer the OAuth redirect_uri.
    command: >
      bash -c "uv pip install fastapi uvicorn authlib itsdangerous httpx && python -m uvicorn atmos_gl.api:app --host 0.0.0.0 --port 9000 --proxy-headers --forwarded-allow-ips='172.16.0.0/12'"
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - TZ=Pacific/Auckland
      - PYTHONPATH=/opt/project/src
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - POSTGRES_HOST=atmos_gl_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CONFIG_PATH=/opt/project/config/atmos-gl.json
      - MAPTILER_API_KEY=${MAPTILER_API_KEY}
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - LAYER_BUILDER_ORDER_URL=http://layer_builder:9100
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SESSION_SECRET=${SESSION_SECRET}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:8180}
    restart: unless-stopped
    depends_on:
      atmos_gl_db:
        condition: service_healthy
      atmos_gl_db_migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/opt/project/data
      - ./config:/opt/project/config
    networks:
      - agl

  map_ui:
    image: ghcr.io/paulwaite87/atmos-gl-ui:${IMAGE_TAG:-latest}
    ports:
      # Loopback-only: OAuth sign-in (routes/auth.py) sets a Secure session cookie, which
      # only survives over HTTPS, so external access needs a TLS-terminating reverse
      # proxy in front of this port (e.g. `tailscale serve`, or nginx/Caddy + a cert) --
      # binding 0.0.0.0 here would just serve a plain-HTTP origin sign-in can't work on.
      - "127.0.0.1:8180:8080"
    restart: unless-stopped
    depends_on:
      - map_api
    networks:
      - agl

  atmos_gl_db_init:
    image: alpine:latest
    command: >
      sh -c "chown ${DOCKER_UID:-1000}:${DOCKER_GID:-1000} /var/lib/postgresql/data &&
             chown ${DOCKER_UID:-1000}:${DOCKER_GID:-1000} /var/log/postgresql"
    volumes:
      - agl-pgdata:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    networks:
      - agl

  atmos_gl_db:
    image: postgis/postgis:15-3.3
    # The database STILL needs the user directive because it uses a pre-built image,
    # not your custom Dockerfile
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      atmos_gl_db_init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGTZ: Pacific/Auckland
    ports:
      # Loopback-only: this only needs to be reachable from the host itself (e.g.
      # `make psql`-style local debugging), never from the tailnet or beyond -- binding
      # 0.0.0.0 would let any tailnet peer (including future "shared" friend devices)
      # reach Postgres directly.
      - "127.0.0.1:15432:5432"
    restart: unless-stopped
    volumes:
      - agl-pgdata:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    # log_statement=all (every statement, unconditionally) plus a static log_filename
    # (no strftime escapes -- log_rotation_size can't actually roll to a new file
    # against a fixed name, so the logging collector just keeps appending to the same
    # one forever) together grew a single postgresql.log to ~70GB with no bound.
    # log_statement=none + log_min_duration_statement only logs genuinely slow queries
    # (>1s); log_filename's %a (day-of-week) plus log_truncate_on_rotation=on caps
    # total log volume at ~7 days of daily files, self-bounding with no external
    # cleanup job needed. log_rotation_size stays as a same-day backstop in case of a
    # runaway logging burst -- worst case it truncates and restarts that day's file
    # early, which is an acceptable tradeoff against genuinely unbounded growth.
    command: >
      postgres
      -c max_wal_size=512MB
      -c min_wal_size=128MB
      -c checkpoint_timeout=15min
      -c log_checkpoints=off
      -c logging_collector=on
      -c log_destination=stderr
      -c log_statement=none
      -c log_min_duration_statement=1000
      -c log_directory=/var/log/postgresql
      -c log_filename='postgresql-%a.log'
      -c log_rotation_age=1440
      -c log_rotation_size=500MB
      -c log_truncate_on_rotation=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agl

  atmos_gl_db_migrate:
    image: ghcr.io/paulwaite87/atmos-gl:${IMAGE_TAG:-latest}
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - PYTHONPATH=/opt/project/src
      - POSTGRES_HOST=atmos_gl_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      atmos_gl_db:
        condition: service_healthy
    networks:
      - agl

networks:
  agl:
    driver: bridge

volumes:
  agl-pgdata:
  postgres_logs:
