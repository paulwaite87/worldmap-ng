<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos GL Live</title>
    <link href="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #04040e; }
        #globeViz { width: 100vw; height: 100vh; }
        /* Global cap for every maplibregl.Popup's content (hoverPopup() and any other
           caller) -- some feed reports (e.g. volcanoes' GVP report_description) run to
           several paragraphs and would otherwise stretch the popup off-screen. Scrolls
           internally past this height instead. */
        .maplibregl-popup-content {
            max-height: 320px;
            overflow-y: auto;
        }
        #basemap-picker-host {
            position: absolute; top: 65px; right: 12px; z-index: 5;
        }
        .basemap-picker {
            display: flex; flex-direction: column; gap: 2px;
            background: rgba(20,22,28,0.78); padding: 6px 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.12);
            font: 12px/1.2 system-ui, sans-serif; color: #cfd3da;
            backdrop-filter: blur(4px);
        }
        .basemap-picker__label { font-weight: 600; opacity: 0.7; }
        .basemap-picker__select {
            background: #1b1e24; color: #e6e8ec; border: 1px solid rgba(255,255,255,0.18);
            border-radius: 4px; padding: 3px 6px; font: inherit;
        }
        .basemap-picker__select:disabled { opacity: 0.5; }

        /* Top-right toolbar: settingsBtn + authWidget share one flex row anchored by
           the wrapper, rather than each being independently right-offset -- two
           magic-number offsets left no reserved space for either one's actual
           rendered width, so a wide enough settingsBtn could overlap authWidget's
           rightmost child regardless of what was in it. DOM order is left-to-right
           visual order: settingsBtn, then authWidget. */
        #topRightBar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #settingsBtn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            transition: all 0.2s;
            /* Shown only for a signed-in admin -- see ui/modules/_auth.js's render(),
               which toggles this once /api/auth/me resolves. Hidden by default here so
               there's no flash of visibility for a non-admin/signed-out visitor before
               that fetch completes. */
            display: none;
        }
        #settingsBtn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        /* Account menu (issue #325): a single hamburger icon regardless of sign-in
           state, so #topRightBar's width never changes between signed-in/out and
           #settingsBtn never has to reflow around it -- unlike the old flat
           "email + My Settings + Sign out" row, whose width varied with the email's
           length. */
        #authWidget {
            position: relative;
            font-family: sans-serif;
        }
        .auth-menu__toggle {
            width: 36px;
            height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            padding: 0;
        }
        .auth-menu__toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .auth-menu__bar {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 1px;
            background: white;
        }
        .auth-menu__panel {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 220px;
            background: rgba(24, 26, 32, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            padding: 8px 0;
            color: white;
        }
        .auth-menu__panel.is-open {
            display: block;
        }
        .auth-menu__header {
            padding: 10px 16px 8px;
        }
        .auth-menu__name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .auth-menu__email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .auth-menu__divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 8px 0;
        }
        .auth-menu__item {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            color: white;
            text-align: left;
            text-decoration: none;
            font: inherit;
            font-size: 14px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .auth-menu__item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .auth-menu__version {
            padding: 6px 16px 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        /* Zoom control (trackpad-without-a-mouse aid): two stacked buttons matching
           settingsBtn/auth-menu__toggle's chrome, sat next to the zoom readout in
           #bottomLeftBar. */
        #zoomControl {
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }
        .zoom-control__btn {
            width: 36px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-family: sans-serif;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s;
            padding: 0;
        }
        .zoom-control__btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .zoom-control__btn + .zoom-control__btn {
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        #bottomLeftBar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #zoomDisplay {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
        }
        #legend-stack {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            pointer-events: none;
        }
        .legend-slot {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* The only legend content that's live text rather than an <img> (wind.js's
               gradient bar) had no font-family of its own, so it fell back to the
               browser's serif default -- every backend-rendered key PNG (precipitation,
               sst, etc.) renders sans-serif via matplotlib's own default font, so this
               is the one place client-built legend text needs to match. */
            font-family: sans-serif;
        }
        /* One global show/hide-all control, not per-legend (ui/modules/_legend.js's
           initLegendToggle()) -- hides the whole .legend-slot box (chrome included),
           not just its <img>, so no empty dark boxes are left floating when hidden. */
        #legend-stack.legends-hidden .legend-slot {
            display: none;
        }
        #legend-toggle {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            line-height: 1;
            font-size: 14px;
            font-family: sans-serif;
            cursor: pointer;
            pointer-events: auto;
            align-self: flex-start;
        }
    </style>
    <script src="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.js"></script>
</head>
<body>
    <div id="legend-stack"></div>
    <script type="module">
        // Independent of the main map bootstrap below -- #legend-stack exists in the
        // static markup, so this doesn't need to wait on config/map load at all.
        import { initLegendToggle } from './modules/_legend.js';
        initLegendToggle();
    </script>
    <div id="topRightBar">
        <a href="/config" id="settingsBtn" target="_blank">Configuration Control</a>
        <div id="authWidget"></div>
    </div>
    <script type="module">
        // Independent of the main map bootstrap below -- #authWidget/#settingsBtn exist
        // in the static markup, so this doesn't need to wait on config/map load at all.
        import { initAuthWidget } from './modules/_auth.js';
        initAuthWidget();
    </script>
    <div id="basemap-picker-host"></div>
    <div id="bottomLeftBar">
        <div id="zoomControl">
            <button type="button" id="zoomInBtn" class="zoom-control__btn" title="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" class="zoom-control__btn" title="Zoom out">&minus;</button>
        </div>
        <div id="zoomDisplay"></div>
    </div>

    <div id="globeViz"></div>

    <script type="module">
        async function bootstrapAtmosGL() {
            try {
                // 1. Fetch live application configuration block from backend API, plus
                // (in parallel) which layers are actually collecting data right now --
                // GET /api/layer_availability (lib/layer_availability.py), same public
                // tier as /api/config. A layer's stored `enabled` is meaningless if its
                // collector is off (e.g. an admin's flightradar_collector kill-switch);
                // ANDing this in below at mount time keeps that consistent from frame
                // one, matching what config.html/me_settings.html show on their Show
                // tab and what _reconcile.js's live poll enforces from here on.
                const [response, availabilityResponse] = await Promise.all([
                    fetch('/api/config'),
                    fetch('/api/layer_availability'),
                ]);
                const fullConfig = await response.json();
                const configData = fullConfig.data;
                const layerAvailability = (await availabilityResponse.json()).data || {};

                // 2. Extract dynamically injected key
                const maptilerKey = configData.common?.api_key || '';
                const startingLatitude = configData.common?.starting_latitude || 0.0;
                const startingLongitude = configData.common?.starting_longitude || 0.0;

                if (configData.common?.RULE__missing_maptiler) {
                    console.warn("MapTiler API Key missing! Check your host .env configuration.");
                }

                const styleUrl = `https://api.maptiler.com/maps/satellite/style.json?key=${maptilerKey}`;
                let mapStyle = styleUrl;
                try {
                    const styleJson = await (await fetch(styleUrl)).json();
                    if (!styleJson.glyphs) {
                        styleJson.glyphs = `https://api.maptiler.com/fonts/{fontstack}/{range}.pbf?key=${maptilerKey}`;
                        console.info('[markers] injected MapTiler glyphs endpoint for label rendering.');
                    }
                    mapStyle = styleJson;
                } catch (err) {
                    console.warn('Could not pre-fetch map style to verify glyphs; using style URL as-is.', err);
                }

                // Initialize the map core
                const map = new maplibregl.Map({
                    container: 'globeViz',
                    style: mapStyle,
                    center: [startingLongitude, startingLatitude],
                    zoom: 2.5,
                    projection: 'globe' // Start with a spherical projection
                });

                // Live zoom-level readout (bottom-left overlay; #zoomDisplay in the <style>
                // block above already had its styling -- this is the element + wiring).
                const zoomDisplay = document.getElementById('zoomDisplay');
                const updateZoom = () => {
                    zoomDisplay.innerText = `Zoom: ${map.getZoom().toFixed(2)}`;
                };
                map.on('zoom', updateZoom);
                map.on('load', updateZoom);

                // Zoom control buttons (#bottomLeftBar's zoomControl) -- a trackpad-without-
                // a-mouse aid; the "up to whole degrees" zoom step comes from map.zoomIn/
                // zoomOut's own default (+/-1) rather than a hand-picked delta here.
                document.getElementById('zoomInBtn')?.addEventListener('click', () => map.zoomIn());
                document.getElementById('zoomOutBtn')?.addEventListener('click', () => map.zoomOut());

                // ---- Layer mounting + teardown registry (HOISTED) -------------------
                const ALL_LAYERS = [
                    'sst', 'currents', 'waves', 'ozone', 'temperature', 'pwat', 'clouds',
                    'terminator', 'precipitation', 'stormwatch', 'wind', 'jetstream', 'isobars',
                    'quakes', 'volcanoes', 'fires', 'world_events', 'troublespots', 'lightning', 'storms', 'shipping', 'satellites',
                    'markers', 'flightradar', 'greenhouse_gases', 'air_quality', 'flood_risk', 'landmass'
                ];
                let layerCleanups = [];
                let layersMounted = false;
                let mountInFlight = false;
                let oneTimeDone = false;

                // A layer whose collector isn't currently collecting mounts as if it
                // were disabled, regardless of its own stored `enabled` -- the stored
                // value itself is never touched (see grilled design: the settings
                // pages must keep showing the user's real preference, just grayed
                // out), only what gets passed to loadLayer() here.
                const withAvailability = (moduleName, cfg) => {
                    const avail = layerAvailability[moduleName];
                    if (!avail || avail.collecting) return cfg;
                    return { ...cfg, enabled: false };
                };

                const mountAllLayers = async () => {
                    // Promise.allSettled prevents one broken layer module from stopping the rest
                    await Promise.allSettled(ALL_LAYERS.map(async (moduleName) => {
                        try {
                            // Removed ?t=${Date.now()} to prevent memory leaks on style swaps
                            const module = await import(`/modules/${moduleName}.js`);
                            const cfg = withAvailability(moduleName, configData[moduleName] || {});
                            const cleanup = await module.loadLayer(map, cfg, configData);
                            if (typeof cleanup === 'function') layerCleanups.push(cleanup);
                        } catch (err) {
                            console.warn(`Could not load layer /modules/${moduleName}.js`, err);
                        }
                    }));
                };

                const teardownAllLayers = () => {
                    for (const cleanup of layerCleanups) {
                        try { cleanup(); } catch (err) { console.warn('layer cleanup failed', err); }
                    }
                    layerCleanups = [];
                };

                // ---- One-time setup (HOISTED) ---------------------------------------
                const oneTimeSetup = async () => {
                    if (oneTimeDone) return;
                    oneTimeDone = true;

                    let isUserInteracting = false;
                    let viewportReportTimer = null;
                    // Best-effort, debounced (3s settle) report of "what the map is
                    // currently centered on" to the backend -- LightningCollector (a
                    // separate container, sharing only Postgres) uses this to weight its
                    // scan queue toward wherever the map actually is right now. Continuous
                    // moves (auto-rotate) keep resetting the timer and never fire, which is
                    // correct: there's no single "current viewport" to report while rotating.
                    const reportViewport = () => {
                        const center = map.getCenter();
                        fetch(`${window.WM_API}/viewport`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ lat: center.lat, lon: center.lng, zoom: map.getZoom() }),
                        }).catch(() => { /* best-effort; collector just keeps its last-known viewport */ });
                    };
                    map.on('movestart', () => { isUserInteracting = true; });
                    map.on('moveend', () => {
                        isUserInteracting = false;
                        clearTimeout(viewportReportTimer);
                        viewportReportTimer = setTimeout(reportViewport, 3000);
                    });

                    if (configData.common && configData.common.auto_rotate === true) {
                        const rotationSpeed = configData.common.auto_rotate_speed || 0.1;
                        const rotateGlobe = () => {
                            if (!isUserInteracting) {
                                const center = map.getCenter();
                                center.lng = (center.lng + rotationSpeed) % 360;
                                map.setCenter(center);
                            }
                            requestAnimationFrame(rotateGlobe);
                        };
                        rotateGlobe();
                    }

                    // Relative to whatever origin this page is served from -- map_api
                    // is reverse-proxied behind the same origin (see config/nginx.conf),
                    // so no absolute host:port is hardcoded here anymore.
                    window.MAP_UI = "";
                    window.WM_API = "/api";
                    reportViewport(); // initial signal, before any user pan/zoom

                    try {
                        const { initForecastTimeline } = await import(`/modules/timeline_boot.js`);
                        await initForecastTimeline(configData);
                    } catch (err) {
                        console.warn('Could not init forecast timeline', err);
                    }
                };

                // ---- ATMOSPHERE / SKY (config-gated by common.atmosphere) -----------
                // Procedural globe halo + starfield (no data — pure stagecraft to make the
                // planet read as a 3D body in space). setStyle wipes sky/fog/light, so this
                // is re-applied on every style.load alongside the projection. When the
                // terminator layer is enabled, the sun/light is synced to the real subsolar
                // point (shared with the terminator shadow) so the day/night shading aligns.
                let sunPollId = null;

                // Convert a subsolar lat/lon into MapLibre's globe light position
                // [radial, azimuth, polar]. Globe lighting with anchor:'map' has a rotated
                // axis; this is the community-verified correction (maplibre-gl-js #5240).
                const lightPosition = (lat, lon) => {
                    const sin = (d) => Math.sin(d * Math.PI / 180);
                    const cos = (d) => Math.cos(d * Math.PI / 180);
                    const acos = (v) => Math.acos(Math.max(-1, Math.min(1, v))) * 180 / Math.PI;
                    const b = acos(cos(lat) * cos(lon));
                    const a = acos(sin(lat) / Math.max(1e-6, sin(b * Math.PI / 180)));
                    return [-1, a, b];
                };

                const applySun = async () => {
                    try {
                        const r = await fetch(`${window.WM_API}/terminator/geojson?t=${Date.now()}`);
                        if (!r.ok) return;
                        const fc = await r.json();
                        const ss = fc && fc.subsolar;
                        if (!ss) return;
                        map.setLight({ anchor: 'map', color: 'white', intensity: 0.5,
                                       position: lightPosition(ss.lat, ss.lon) });
                    } catch (e) { /* leave default light on failure */ }
                };

                const setupAtmosphere = () => {
                    if (!configData.common?.atmosphere) return;
                    try {
                        // Sky halo + hazy limb: strong at whole-globe zoom, fading out as you
                        // zoom in (atmosphere only reads at planet scale). MapLibre merged the
                        // old Mapbox-style setFog() into setSky() -- color/high-color/
                        // space-color/star-intensity no longer exist, and fog-* properties
                        // need 3D terrain (unavailable on a bare globe) -- so sky-color/
                        // horizon-color now carry the same "space above, blue haze at the
                        // limb" look that setFog used to.
                        map.setSky({
                            'sky-color': 'rgba(2,3,8,1)',          // near-black space, upper sky
                            'horizon-color': 'rgba(30,50,90,1)',   // hazy upper-atmosphere blue at the limb
                            'sky-horizon-blend': 0.8,
                            'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0],
                        });
                        // Sync the sun to the real subsolar point only when the terminator
                        // layer is on; otherwise leave MapLibre's default light.
                        if (sunPollId) { clearInterval(sunPollId); sunPollId = null; }
                        if (configData.terminator?.enabled) {
                            applySun();
                            sunPollId = setInterval(applySun, 60000);   // sun drifts ~0.25°/min
                        }
                    } catch (err) {
                        console.warn('[atmosphere] could not apply sky/fog; continuing.', err);
                    }
                };

                // ---- THE SYNCHRONOUS MOUNT HANDLER ----------------------------------
                const onStyleLoadMount = async () => {
                    if (mountInFlight || layersMounted) return;
                    mountInFlight = true;
                    try {
                        map.setProjection({ type: 'globe' });
                        setupAtmosphere();          // re-apply sky/fog/sun (wiped by setStyle)
                        await oneTimeSetup();
                        await mountAllLayers();
                        layersMounted = true;
                    } finally {
                        mountInFlight = false;
                    }
                };

                // Attach IMMEDIATELY. No `awaits` between map creation and this block.
                map.on('style.load', onStyleLoadMount);
                // Catch the event if it already fired while synchronous code was executing
                if (map.isStyleLoaded()) {
                    onStyleLoadMount();
                }

                // ---- BASEMAP PICKER (Awaited SAFELY at the end) ---------------------
                try {
                    const { buildBasemapStyle, mountBasemapPicker } = await import(`/basemap.js`);
                    if (mountBasemapPicker && buildBasemapStyle) {
                        let currentSlug = configData.common?.basemap || 'satellite';
                        const host = document.getElementById('basemap-picker-host') || document.body;

                        mountBasemapPicker(host, currentSlug, async (slug) => {
                            if (slug === currentSlug) return;
                            const cam = {
                                center: map.getCenter(), zoom: map.getZoom(),
                                bearing: map.getBearing(), pitch: map.getPitch()
                            };

                            teardownAllLayers();
                            layersMounted = false;

                            const newStyle = await buildBasemapStyle(slug, maptilerKey);
                            currentSlug = slug;

                            map.once('style.load', () => { map.jumpTo(cam); });
                            map.setStyle(newStyle);
                        });
                    }
                } catch (err) {
                    console.warn('[basemap] picker unavailable; continuing without it.', err);
                }

            } catch (err) {
                console.error("Failed to bootstrap runtime configuration framework:", err);
            }
        }

        // Initialize execution setup
        bootstrapAtmosGL();
    </script>
</body>
</html>
