name: Publish Docker Images to GHCR

# Triggers the workflow when a pull request targeting master is closed, when an
# X.Y.Z release tag is pushed (no "v" prefix -- e.g. 2.0.0), or when you manually
# trigger it from the GitHub Actions tab.
on:
  pull_request:
    branches: [ "master" ]
    types: [ "closed" ]
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # This automatically evaluates to paulwaite87/atmos-gl
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Runs for a real tag push or a manual dispatch unconditionally, and for a
    # pull_request event only if it closed via a successful merge (not just closed).
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    # Grants the workflow permission to write to your Packages registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A tag push publishes a pinned, versioned image (e.g. :2.0.0) instead of
      # touching :latest -- :latest keeps tracking master merges as it always has,
      # release tags are a separate, deliberate "cut a release" action. `version` is
      # separate from `value` (the docker tag): it's baked into the app image itself
      # (see Dockerfile's APP_VERSION) so a running container can report exactly what
      # it is via GET /api/version, even when it was pulled via the floating :latest
      # tag rather than a release tag.
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
            echo "version=latest@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Main Python App
      - name: Build and push main app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          build-args: APP_VERSION=${{ steps.tag.outputs.version }}

      # Build and Push UI
      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:${{ steps.tag.outputs.value }}
