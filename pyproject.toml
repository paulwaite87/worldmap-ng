[project]
name = "atmos_gl"
version = "1.0.0"
description = "Builds overlays and marker files for Xplanet"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Paul Waite", email = "paulwaite87@gmail.com" },
]
# Core dependencies for the Atmos GL system
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.5",
    "authlib>=1.7.2",
    "beautifulsoup4==4.14.3",
    "cartopy==0.25.0",
    "cdsapi>=0.7.7",
    "cfgrib==0.9.15.1",
    "configparser==7.2.0",
    "contourpy>=1.3.3",
    "dask==2026.3.0",
    "datetime==6.0",
    "eccodes==2.46.0",
    "eccodes-python==0.9.9",
    "fastapi>=0.136.1",
    "fsspec>=2026.3.0",
    "geoalchemy2>=0.20.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "idna==3.11",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "matplotlib==3.10.8",
    "netcdf4==1.7.4",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pillow==12.2.0",
    "pip>=26.1.1",
    "psycopg2-binary>=2.9.12",
    "pydap==3.5.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "rasterio>=1.5.0",
    "requests==2.33.1",
    "scipy==1.17.1",
    "sgp4>=2.25",
    "six==1.17.0",
    "skyfield>=1.54",
    "soupsieve==2.8.3",
    "sqlalchemy>=2.0.51",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
    "uvicorn>=0.47.0",
    "watchdog>=6.0.0",
    "websocket-client==1.9.0",
    "websockets==16.0",
    "xarray==2026.4.0",
    "zope-interface==8.3",
]

[project.scripts]
layerbuilder = "atmos_gl.layer_builder:main"
housekeeper = "atmos_gl.housekeeper:main"
shippingcollector = "atmos_gl.collectors.shipping:main"
lightningcollector = "atmos_gl.collectors.lightning:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atmos_gl"]

[tool.uv]
# Moved linting and formatting tools to dev-dependencies
[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.11",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning"
]
